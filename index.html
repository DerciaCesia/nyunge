<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We'll be back soon!</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --deep: #0f2428;
      --teal: #1d4a52;
      --gold: #e0b25a;
      --blush: #f1d9d3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--blush);
      background:
        radial-gradient(ellipse at 50% 0%, var(--teal) 0%, transparent 70%),
        var(--deep);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Photo: keeps its natural proportions, never stretched */
    .photo {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      max-height: 68vh;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;          /* crops, never squashes */
      object-position: 50% 65%;   /* keeps the person and shirt in view */
      display: block;
    }

    /* Photo melts into the background below */
    .photo::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 55%;
      background: linear-gradient(to bottom, rgba(15, 36, 40, 0) 0%, var(--deep) 100%);
    }

    .message {
      position: relative;
      text-align: center;
      padding: 0 24px 72px;
      margin-top: -64px;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #fff;
    }

    .line {
      width: 64px;
      height: 2px;
      background: var(--gold);
      margin: 22px auto;
      border: 0;
    }

    p {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      line-height: 1.6;
      color: var(--blush);
    }


    .follow {
      margin-top: 44px;
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin: 18px 0 26px;
    }

    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(224, 178, 90, 0.55);
      border-radius: 50%;
      color: var(--gold);
      transition: background 0.25s, color 0.25s;
    }

    .social a:hover { background: var(--gold); color: var(--deep); }
    .social svg { width: 20px; height: 20px; fill: currentColor; }

    .email {
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      color: var(--blush);
      text-decoration: none;
      border-bottom: 1px solid rgba(224, 178, 90, 0.5);
      padding-bottom: 3px;
    }

    .email:hover { color: #fff; }

    @media (max-width: 600px) {
      .photo { aspect-ratio: 4 / 5; max-height: 60vh; }
      .photo img { object-position: 62% 70%; }
      .message { margin-top: -48px; padding-bottom: 56px; }
    }
  </style>
</head>
<body>
  <div class="photo">
    <img src="maintenance.jpg" alt="A woman in a teal t-shirt with a mask print, reaching toward a tree branch in a park">
  </div>

  <main class="message">
    <h1>We'll be back soon!</h1>
    <hr class="line">
    <p>Website is being updated.</p>

    <div class="follow">Follow us @nyunge.seeds</div>
    <div class="social">
      <a href="https://www.instagram.com/nyunge.seeds" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 4 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7C8.3 24 8.7 24 12 24s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg>
      </a>
      <a href="https://www.facebook.com/nyunge.seeds" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>

    </div>

    <a class="email" href="mailto:info@nyunge.com.au">info@nyunge.com.au</a>
  </main>
</body>
</html>
